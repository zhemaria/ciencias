<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ciclo del Carbono — Simulación 3D</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      overflow: hidden;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #050505;
      color: white;
    }
    canvas { display: block; }

    /* ===== Panel de etapa ===== */
    #panel-etapa {
      position: absolute;
      top: 20px;
      left: 20px;
      max-width: 400px;
      padding: 18px 22px;
      background: rgba(8, 18, 35, 0.78);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border-radius: 14px;
      border-left: 5px solid #84cc16;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
      transition: border-color 0.6s ease;
      pointer-events: none;
    }
    #etapa-numero {
      font-size: 12px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #bef264;
      opacity: 0.85;
      margin: 0 0 4px 0;
    }
    #etapa-titulo {
      font-size: 22px;
      font-weight: 700;
      color: #ffffff;
      margin: 0 0 8px 0;
      text-shadow: 0 2px 8px rgba(0,0,0,0.6);
    }
    #etapa-desc {
      font-size: 14px;
      line-height: 1.5;
      opacity: 0.92;
      margin: 0 0 12px 0;
    }
    .barra-progreso {
      width: 100%;
      height: 5px;
      background: rgba(255,255,255,0.15);
      border-radius: 3px;
      overflow: hidden;
    }
    #barra-relleno {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #84cc16, #bef264);
      border-radius: 3px;
      transition: width 0.1s linear;
    }

    /* ===== Indicadores (6 etapas) ===== */
    #indicadores {
      position: absolute;
      bottom: 22px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 8px;
      padding: 10px 14px;
      background: rgba(8, 18, 35, 0.7);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border-radius: 30px;
      pointer-events: auto;
    }
    .punto {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border-radius: 20px;
      background: rgba(255,255,255,0.08);
      transition: all 0.4s ease;
      font-size: 12px;
      opacity: 0.6;
      cursor: pointer;
    }
    .punto:hover {
      background: rgba(132, 204, 22, 0.2);
      opacity: 0.95;
    }
    .punto.activo {
      background: rgba(132, 204, 22, 0.3);
      opacity: 1;
      transform: scale(1.05);
      box-shadow: 0 0 12px rgba(132, 204, 22, 0.4);
    }
    .punto-icono { font-size: 16px; }

    /* ===== Ayuda y botones ===== */
    #ayuda {
      position: absolute;
      bottom: 22px;
      right: 22px;
      color: rgba(255,255,255,0.55);
      font-size: 11px;
      text-align: right;
      line-height: 1.5;
      pointer-events: none;
    }
    #btn-pausa, #btn-educativo {
      position: absolute;
      right: 22px;
      padding: 10px 16px;
      background: rgba(8, 18, 35, 0.75);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,0.15);
      color: white;
      font-size: 13px;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.2s;
    }
    #btn-pausa { top: 22px; }
    #btn-educativo { top: 70px; }
    #btn-pausa:hover {
      background: rgba(132, 204, 22, 0.25);
      border-color: rgba(132, 204, 22, 0.5);
    }
    #btn-educativo:hover {
      background: rgba(132, 204, 22, 0.25);
      border-color: rgba(132, 204, 22, 0.5);
    }
    #btn-educativo.activo {
      background: rgba(132, 204, 22, 0.3);
      border-color: rgba(132, 204, 22, 0.6);
    }

    /* ===== Panel educativo (modal) ===== */
    #panel-educativo {
      display: none;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      max-width: 600px;
      width: calc(100% - 60px);
      max-height: 82vh;
      overflow-y: auto;
      padding: 28px 32px;
      background: rgba(8, 18, 35, 0.96);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 18px;
      border: 2px solid rgba(132, 204, 22, 0.4);
      box-shadow: 0 12px 48px rgba(0, 0, 0, 0.6);
      z-index: 100;
      pointer-events: auto;
    }
    #panel-educativo.visible { display: block; }
    #panel-educativo h2 {
      margin: 0 0 14px 0;
      font-size: 22px;
      color: #84cc16;
      border-bottom: 2px solid rgba(132, 204, 22, 0.3);
      padding-bottom: 10px;
    }
    #panel-educativo p { margin: 10px 0; line-height: 1.6; font-size: 15px; }
    #panel-educativo ul { margin: 10px 0; padding-left: 22px; line-height: 1.7; }
    #panel-educativo li { margin: 4px 0; font-size: 14px; }
    #panel-educativo b { color: #bef264; }
    #btn-continuar {
      display: block;
      margin: 20px auto 0;
      padding: 12px 26px;
      background: linear-gradient(135deg, #65a30d, #84cc16);
      color: white;
      font-size: 15px;
      font-weight: 600;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.2s;
    }
    #btn-continuar:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 16px rgba(132, 204, 22, 0.4);
    }

    /* Colores por etapa */
    .stage-0 { border-left-color: #84cc16 !important; }
    .stage-0 #etapa-numero { color: #bef264 !important; }
    .stage-1 { border-left-color: #22c55e !important; }
    .stage-1 #etapa-numero { color: #86efac !important; }
    .stage-2 { border-left-color: #ca8a04 !important; }
    .stage-2 #etapa-numero { color: #fde68a !important; }
    .stage-3 { border-left-color: #ef4444 !important; }
    .stage-3 #etapa-numero { color: #fca5a5 !important; }
    .stage-4 { border-left-color: #0ea5e9 !important; }
    .stage-4 #etapa-numero { color: #7dd3fc !important; }
    .stage-5 { border-left-color: #475569 !important; }
    .stage-5 #etapa-numero { color: #cbd5e1 !important; }
  </style>
</head>
<body>

  <div id="panel-etapa" class="stage-0">
    <p id="etapa-numero">Etapa 1 de 6</p>
    <h1 id="etapa-titulo">Iniciando…</h1>
    <p id="etapa-desc">Cargando la simulación.</p>
    <div class="barra-progreso"><div id="barra-relleno"></div></div>
  </div>

  <div id="indicadores">
    <div class="punto activo" data-i="0"><span class="punto-icono">🌱</span><span>Fotosíntesis</span></div>
    <div class="punto" data-i="1"><span class="punto-icono">🐄</span><span>Respiración</span></div>
    <div class="punto" data-i="2"><span class="punto-icono">🍂</span><span>Descomposición</span></div>
    <div class="punto" data-i="3"><span class="punto-icono">🏭</span><span>Combustión</span></div>
    <div class="punto" data-i="4"><span class="punto-icono">🌊</span><span>Océano</span></div>
    <div class="punto" data-i="5"><span class="punto-icono">🪨</span><span>Geológico</span></div>
  </div>

  <button id="btn-pausa">⏸ Pausar</button>
  <button id="btn-educativo">📚 Modo educativo: OFF</button>

  <div id="panel-educativo">
    <h2 id="edu-titulo">Título</h2>
    <div id="edu-cuerpo"></div>
    <button id="btn-continuar">Siguiente etapa →</button>
  </div>

  <div id="ayuda">
    Cámara automática siguiendo el ciclo<br>
    Cada etapa dura ~5 segundos · clic en una etapa para saltar
  </div>

  <script>
  /* =========================================================
     CICLO DEL CARBONO — Simulación 3D
     6 etapas: Fotosíntesis · Respiración · Descomposición ·
     Combustión · Intercambio océano · Almacenamiento geológico
     ========================================================= */

  // ---------- Variables globales ----------
  let scene, camera, renderer, clock;
  let terrain, ocean, sun, sunGlow, sunLight;
  let arboles = [];
  let parchesHierba = [];
  let vaca, humano, casa, fabrica, coche, arbolCaido;
  let depositosFosiles = [];
  let nubeAmbiente;            // CO₂ siempre flotando en la atmósfera
  let nubes = [];              // grupos de nubes que dan sombra al paisaje
  let flujos = [];             // todos los streams de partículas
  let etiquetas3D = [];

  // Caché de texturas de partícula (debe declararse aquí, antes de init(),
  // porque texturaPart() las consulta desde crearFlujos durante init).
  const TEX_CACHE = {};

  let pausado = false;
  let tiempoSimulado = 0;
  let etapaActual = -1;
  let modoEducativo = false;
  let pausaEducativaActiva = false;
  let ultimaEtapaPausada = -1;

  const DURACION_ETAPA = 5.0;
  const TOTAL_ETAPAS = 6;
  const CICLO_TOTAL = DURACION_ETAPA * TOTAL_ETAPAS;

  const ETAPAS = [
    {
      num: "Etapa 1 de 6",
      titulo: "Fotosíntesis",
      desc: "Las plantas absorben CO₂ del aire y, con la energía del sol, producen oxígeno y materia orgánica.",
      clase: "stage-0",
      colorNiebla: 0x9bc4d8,
      foco: { x: -22, y: 4, z: 0, radio: 32 }
    },
    {
      num: "Etapa 2 de 6",
      titulo: "Respiración y cadena alimenticia",
      desc: "Animales y humanos consumen plantas, las metabolizan y devuelven CO₂ al aire al respirar.",
      clase: "stage-1",
      colorNiebla: 0x9bbc9a,
      foco: { x: -8, y: 4, z: 0, radio: 28 }
    },
    {
      num: "Etapa 3 de 6",
      titulo: "Descomposición",
      desc: "Hongos y bacterias descomponen materia orgánica muerta, liberando CO₂ al aire y carbono al suelo.",
      clase: "stage-2",
      colorNiebla: 0x9c8e6a,
      foco: { x: -12, y: 3, z: -10, radio: 28 }
    },
    {
      num: "Etapa 4 de 6",
      titulo: "Combustión industrial",
      desc: "Fábricas y vehículos queman combustibles fósiles, liberando enormes cantidades de CO₂ a la atmósfera.",
      clase: "stage-3",
      colorNiebla: 0x9c7a5a,
      foco: { x: 8, y: 5, z: -3, radio: 30 }
    },
    {
      num: "Etapa 5 de 6",
      titulo: "Intercambio océano-atmósfera",
      desc: "El océano absorbe CO₂ de la atmósfera y libera parte de él, regulando el clima global del planeta.",
      clase: "stage-4",
      colorNiebla: 0x6a9ab8,
      foco: { x: 25, y: 5, z: 4, radio: 38 }
    },
    {
      num: "Etapa 6 de 6",
      titulo: "Almacenamiento geológico",
      desc: "Durante millones de años, parte del carbono queda enterrado bajo tierra, formando carbón, petróleo y gas natural.",
      clase: "stage-5",
      colorNiebla: 0x484850,
      foco: { x: 0, y: -2, z: 0, radio: 34 }
    }
  ];

  // ---------- Etiquetas 3D por etapa ----------
  const ETIQUETAS_POR_ETAPA = [
    [ // 0 - Fotosíntesis
      { texto: '☀  Luz solar',          pos: [-25, 22, -8], color: '#fde047' },
      { texto: 'CO₂ ↓ entra a la hoja', pos: [-15, 12, 6],  color: '#9ca3af' },
      { texto: 'O₂ ↑ sale al aire',      pos: [-32, 14, 6], color: '#7dd3fc' }
    ],
    [ // 1 - Respiración / Cadena
      { texto: '🌿 → 🐄  Alimento',     pos: [-13, 6, 6],  color: '#86efac' },
      { texto: 'CO₂ ↑ respiración',     pos: [-3, 9, 6],   color: '#9ca3af' }
    ],
    [ // 2 - Descomposición
      { texto: '🍂 → CO₂ + suelo',      pos: [-12, 7, -8], color: '#fde68a' }
    ],
    [ // 3 - Combustión
      { texto: '🔥 Quema de fósiles',   pos: [10, 14, -3], color: '#fca5a5' },
      { texto: 'CO₂ ↑↑↑',                pos: [16, 22, 0],  color: '#fda4af' }
    ],
    [ // 4 - Océano
      { texto: 'CO₂ ↓ se disuelve',     pos: [25, 14, -5], color: '#7dd3fc' },
      { texto: 'CO₂ ↑ se libera',       pos: [38, 10, 8],  color: '#bae6fd' }
    ],
    [ // 5 - Geológico
      { texto: '🪨 Carbón y petróleo',  pos: [0, 12, -5],  color: '#cbd5e1' },
      { texto: 'Millones de años ⏳',    pos: [10, 6, -10], color: '#94a3b8' }
    ]
  ];

  // ---------- Explicaciones extendidas (modo educativo) ----------
  const EXPLICACIONES = [
    {
      titulo: '🌱 Más sobre la Fotosíntesis',
      cuerpo: `
        <p><b>La ecuación maestra:</b> 6 CO₂ + 6 H₂O + luz solar → C₆H₁₂O₆ (glucosa) + 6 O₂.</p>
        <p>Las hojas captan CO₂ del aire por sus <b>estomas</b> (microporos) y agua del suelo por las raíces.
        Con la energía del sol absorbida por la <b>clorofila</b>, transforman estas materias primas en glucosa,
        que el árbol usa para crecer y construir madera, hojas y frutos.</p>
        <ul>
          <li>Las plantas terrestres absorben unos <b>120 GtC al año</b> (gigatoneladas de carbono).</li>
          <li>El <b>fitoplancton</b> oceánico hace lo mismo y absorbe otros <b>~50 GtC al año</b>.</li>
          <li>Casi <b>todo el oxígeno que respiramos</b> proviene de la fotosíntesis.</li>
          <li>La clorofila refleja el verde — por eso vemos las hojas de ese color.</li>
        </ul>
        <p><b>Pregunta de repaso:</b> ¿Por qué los bosques y océanos sanos son tan importantes contra el cambio climático?</p>
      `
    },
    {
      titulo: '🐄 Más sobre la Respiración y la Cadena Alimenticia',
      cuerpo: `
        <p><b>La fotosíntesis al revés:</b> C₆H₁₂O₆ + 6 O₂ → 6 CO₂ + 6 H₂O + energía.
        Cuando un animal come una planta, su organismo descompone la glucosa para extraer
        energía. Como subproducto, exhala <b>CO₂ y vapor de agua</b>.</p>
        <ul>
          <li>La respiración de los seres vivos devuelve a la atmósfera unos <b>60 GtC al año</b>.</li>
          <li>La <b>cadena alimenticia</b> transfiere carbono: plantas → herbívoros → carnívoros.</li>
          <li>Cada eslabón de la cadena <b>pierde ~90 % de la energía</b> en calor — por eso hay menos depredadores que presas.</li>
          <li>Tú mismo respiras unos <b>500 g de CO₂ al día</b>.</li>
        </ul>
        <p><b>Pregunta de repaso:</b> Si la fotosíntesis y la respiración son inversas, ¿de dónde sale el carbono que las plantas usan para crecer?</p>
      `
    },
    {
      titulo: '🍂 Más sobre la Descomposición',
      cuerpo: `
        <p><b>El gran reciclador:</b> Cuando un ser vivo muere, hongos, bacterias y otros
        descomponedores rompen sus tejidos. La mayor parte del carbono regresa a la
        atmósfera como CO₂; otra parte se queda en el suelo como <b>materia orgánica</b>
        (humus) que enriquece la tierra.</p>
        <ul>
          <li>La descomposición devuelve a la atmósfera unos <b>60 GtC al año</b>.</li>
          <li>El suelo del planeta almacena <b>~1 500 GtC</b> — más que toda la atmósfera (~870 GtC).</li>
          <li>Sin descomponedores, los nutrientes <b>no se reciclarían</b> y la vida sería imposible.</li>
          <li>El permafrost ártico guarda <b>cantidades enormes</b> de carbono congelado.</li>
        </ul>
        <p><b>Conciencia ambiental:</b> Si el permafrost se derrite por el calentamiento, libera CO₂ y metano —
        un peligroso bucle de retroalimentación.</p>
      `
    },
    {
      titulo: '🏭 Más sobre la Combustión Industrial',
      cuerpo: `
        <p><b>El gran desequilibrio moderno:</b> Al quemar carbón, petróleo y gas natural,
        liberamos en décadas el carbono que la naturaleza tardó <b>millones de años</b>
        en enterrar. Esto rompe el equilibrio del ciclo natural.</p>
        <ul>
          <li>La quema de combustibles fósiles emite unos <b>10 GtC al año</b> (~37 Gt CO₂).</li>
          <li>Antes de la era industrial (1750), había <b>~280 ppm</b> de CO₂ en la atmósfera.</li>
          <li>Hoy estamos en <b>~420 ppm</b> — el nivel más alto en al menos 800 000 años.</li>
          <li>El sector <b>energía y transporte</b> representa ~70 % de las emisiones globales.</li>
        </ul>
        <p><b>Pregunta de repaso:</b> ¿Por qué quemar combustibles fósiles "rompe" el ciclo del carbono pero quemar leña no tanto?</p>
      `
    },
    {
      titulo: '🌊 Más sobre el Intercambio Océano-Atmósfera',
      cuerpo: `
        <p><b>El "pulmón azul" del planeta:</b> El océano absorbe CO₂ atmosférico (se disuelve
        en el agua) y al mismo tiempo libera parte. La diferencia neta es absorción —
        actualmente el océano <b>captura ~25 % del CO₂ que emitimos</b>.</p>
        <ul>
          <li>Flujo entrante: <b>~90 GtC al año</b> hacia el océano.</li>
          <li>Flujo saliente: <b>~88 GtC al año</b> hacia la atmósfera.</li>
          <li>Absorción neta: ~2 GtC al año (gracias al exceso humano).</li>
          <li>El agua fría absorbe más CO₂ que el agua caliente — los océanos polares son sumideros más eficientes.</li>
        </ul>
        <p><b>Problema:</b> Cuando el CO₂ se disuelve en el mar forma ácido carbónico,
        causando <b>acidificación oceánica</b> que daña corales y conchas.</p>
      `
    },
    {
      titulo: '🪨 Más sobre el Almacenamiento Geológico',
      cuerpo: `
        <p><b>El carbono fósil:</b> A lo largo de cientos de millones de años, restos de
        plantas y plancton enterrados sin oxígeno se transformaron por presión y calor en
        <b>carbón, petróleo y gas natural</b>. Estos depósitos son carbono sacado del ciclo
        rápido y guardado en el "ciclo lento".</p>
        <ul>
          <li>Las reservas de combustibles fósiles contienen <b>~5 000 GtC</b>.</li>
          <li>Las rocas sedimentarias del planeta guardan <b>millones de GtC</b> (mayor reservorio).</li>
          <li>El carbón se formó principalmente hace <b>300 millones de años</b> (período Carbonífero).</li>
          <li>El ciclo geológico devuelve carbono a la atmósfera por <b>volcanes y meteorización</b>, pero muy lentamente.</li>
        </ul>
        <p><b>Y el ciclo se reinicia:</b> El carbono que las plantas absorberán mañana puede haber sido
        respirado por un animal hace una semana, por un volcán hace mil años, o liberado de un combustible
        fósil enterrado hace 300 millones de años. <b>Todo está conectado a través del tiempo.</b></p>
      `
    }
  ];

  // =========================================================
  // INICIALIZACIÓN
  // =========================================================
  init();
  animate();

  function init() {
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x9bc4d8);
    scene.fog = new THREE.Fog(0x9bc4d8, 50, 160);

    camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 500);
    camera.position.set(40, 28, 40);
    camera.lookAt(0, 4, 0);

    renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.body.appendChild(renderer.domElement);

    clock = new THREE.Clock();

    crearLuces();
    crearTerreno();
    crearOceano();
    crearSol();
    crearAtmosferaAmbiente();
    crearNubes();
    crearBosque();
    crearHierba();
    crearVaca();
    crearHumanoYCasa();
    crearFabricaYCoche();
    crearArbolCaido();
    crearDepositosFosiles();
    crearFlujos();
    crearEtiquetas3D();

    // Eventos
    window.addEventListener('resize', onResize, false);

    document.getElementById('btn-pausa').addEventListener('click', () => {
      pausado = !pausado;
      document.getElementById('btn-pausa').innerHTML = pausado ? '▶ Reanudar' : '⏸ Pausar';
    });

    document.getElementById('btn-educativo').addEventListener('click', () => {
      modoEducativo = !modoEducativo;
      const btn = document.getElementById('btn-educativo');
      btn.textContent = modoEducativo ? '📚 Modo educativo: ON' : '📚 Modo educativo: OFF';
      btn.classList.toggle('activo', modoEducativo);
      if (!modoEducativo) cerrarPanelEducativo();
    });

    document.getElementById('btn-continuar').addEventListener('click', () => {
      cerrarPanelEducativo();
      const ciclos = Math.floor(tiempoSimulado / CICLO_TOTAL);
      const etapaLocal = Math.floor((tiempoSimulado % CICLO_TOTAL) / DURACION_ETAPA);
      const sigEtapa = (etapaLocal + 1) % TOTAL_ETAPAS;
      const ciclosNuevos = sigEtapa === 0 ? ciclos + 1 : ciclos;
      tiempoSimulado = ciclosNuevos * CICLO_TOTAL + sigEtapa * DURACION_ETAPA + 0.05;
      etapaActual = -1;
    });

    document.querySelectorAll('.punto').forEach((p, idx) => {
      p.addEventListener('click', () => saltarAEtapa(idx));
    });
  }

  function saltarAEtapa(idx) {
    cerrarPanelEducativo();
    const ciclos = Math.floor(tiempoSimulado / CICLO_TOTAL);
    tiempoSimulado = ciclos * CICLO_TOTAL + idx * DURACION_ETAPA + 0.05;
    etapaActual = -1;
    ultimaEtapaPausada = -1;
  }

  // =========================================================

  function crearTerreno() {
    const seg = 80;
    const geo = new THREE.PlaneGeometry(120, 120, seg, seg);
    const pos = geo.attributes.position;
    const colores = [];
    const color = new THREE.Color();

    for (let i = 0; i < pos.count; i++) {
      const x = pos.getX(i);
      const y = pos.getY(i);

      // Terreno suave con leve relieve
      let h = Math.sin(x * 0.08) * 0.6 + Math.cos(y * 0.1) * 0.5
            + Math.sin(x * 0.25 + y * 0.2) * 0.4;

      // Una colina suave en la zona del bosque (x ~ -25)
      const distBosque = Math.sqrt((x + 25) * (x + 25) + (y + 5) * (y + 5));
      h += 4 * Math.exp(-distBosque * 0.05);

      // Bajada al océano (x > 16)
      if (x > 16) {
        const factor = Math.min(1, (x - 16) / 14);
        h = h * (1 - factor) + (-3 - factor * 2) * factor;
      }

      pos.setZ(i, h);

      // Color por zona y altura
      if (h < -0.5) {
        // Fondo arenoso
        color.setRGB(0.78, 0.7, 0.45);
      } else if (h < 0.5 && x > 14) {
        // Playa
        color.setRGB(0.85, 0.78, 0.55);
      } else if (x < -10) {
        // Zona de bosque
        color.setRGB(0.22, 0.4, 0.18);
      } else if (x > 4 && y < -2) {
        // Zona industrial (más marrón)
        color.setRGB(0.42, 0.36, 0.24);
      } else {
        // Pradera
        color.setRGB(0.32, 0.55, 0.22);
      }
      colores.push(color.r, color.g, color.b);
    }

    geo.setAttribute('color', new THREE.Float32BufferAttribute(colores, 3));
    geo.computeVertexNormals();

    const mat = new THREE.MeshStandardMaterial({
      vertexColors: true,
      flatShading: false,
      roughness: 0.95,
      metalness: 0.0,
      transparent: true,        // necesario para etapa geológica
      opacity: 1.0
    });

    terrain = new THREE.Mesh(geo, mat);
    terrain.rotation.x = -Math.PI / 2;
    terrain.receiveShadow = true;
    scene.add(terrain);
  }

  function animarOleaje(t) {
    const pos = ocean.geometry.attributes.position;
    const orig = ocean.userData.posOrig;
    for (let i = 0; i < pos.count; i++) {
      const ix = i * 3;
      const x = orig[ix];
      const y = orig[ix + 1];
      const ola = Math.sin(x * 0.18 + t * 1.0) * 0.22
                + Math.cos(y * 0.2 + t * 0.8) * 0.22;
      pos.setZ(i, ola);
    }
    pos.needsUpdate = true;
    ocean.geometry.computeVertexNormals();
  }

  function crearSol() {
    const geo = new THREE.SphereGeometry(3.5, 32, 32);
    const mat = new THREE.MeshBasicMaterial({ color: 0xffe066 });
    sun = new THREE.Mesh(geo, mat);
    sun.position.set(40, 50, 30);
    scene.add(sun);

    const haloTex = generarTexturaHalo();
    const haloMat = new THREE.SpriteMaterial({
      map: haloTex,
      color: 0xfff4b8,
      transparent: true,
      opacity: 0.85,
      blending: THREE.AdditiveBlending,
      depthWrite: false
    });
    sunGlow = new THREE.Sprite(haloMat);
    sunGlow.scale.set(16, 16, 1);
    sun.add(sunGlow);
  }

  function generarTexturaHalo() {
    const canvas = document.createElement('canvas');
    canvas.width = canvas.height = 128;
    const ctx = canvas.getContext('2d');
    const grad = ctx.createRadialGradient(64, 64, 0, 64, 64, 64);
    grad.addColorStop(0,    'rgba(255, 240, 180, 1)');
    grad.addColorStop(0.25, 'rgba(255, 220, 130, 0.7)');
    grad.addColorStop(0.6,  'rgba(255, 200, 100, 0.18)');
    grad.addColorStop(1,    'rgba(255, 200, 100, 0)');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, 128, 128);
    return new THREE.CanvasTexture(canvas);
  }

  function crearAtmosferaAmbiente() {
    // CO₂ ambiente: siempre flotando lento por toda la atmósfera
    const num = 280;
    const geo = new THREE.BufferGeometry();
    const pos = new Float32Array(num * 3);
    const fase = new Float32Array(num);

    for (let i = 0; i < num; i++) {
      pos[i * 3]     = (Math.random() - 0.5) * 110;
      pos[i * 3 + 1] = 8 + Math.random() * 22;
      pos[i * 3 + 2] = (Math.random() - 0.5) * 110;
      fase[i] = Math.random() * Math.PI * 2;
    }
    geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    geo.userData = { fase };

    const mat = new THREE.PointsMaterial({
      size: 0.25,
      color: 0x999999,
      transparent: true,
      opacity: 0.35,
      depthWrite: false,
      sizeAttenuation: true
    });
    nubeAmbiente = new THREE.Points(geo, mat);
    scene.add(nubeAmbiente);
  }

  function animarAtmosferaAmbiente(t) {
    const pos = nubeAmbiente.geometry.attributes.position;
    const fase = nubeAmbiente.geometry.userData.fase;
    for (let i = 0; i < pos.count; i++) {
      const ix = i * 3;
      pos.array[ix]     += Math.sin(t * 0.3 + fase[i]) * 0.015;
      pos.array[ix + 2] += Math.cos(t * 0.25 + fase[i]) * 0.015;
    }
    pos.needsUpdate = true;
  }

  // ---------- Nubes (con proyección de sombras) ----------
  function crearNubes() {
    // Distribución sobre el paisaje. Altura 25-26 — justo encima del techo
    // de cámara (~22), bajas para ser visibles en el frame, pero pequeñas
    // por si la cámara las roza en alguna órbita.
    const posiciones = [
      { x: -28, y: 25, z:  10 },
      { x: -18, y: 26, z:  -3 },
      { x:  -3, y: 25, z:  12 },
      { x:   8, y: 26, z:  -7 },
      { x:  22, y: 25, z:   3 },
      { x:  32, y: 26, z: -10 },
      { x: -32, y: 25, z: -14 },
      { x:   0, y: 26, z: -22 }
    ];

    posiciones.forEach((p, idx) => {
      const grupo = new THREE.Group();
      const numEsferas = 3 + Math.floor(Math.random() * 2); // 3-4 esferas
      for (let j = 0; j < numEsferas; j++) {
        const r = 0.7 + Math.random() * 0.45;               // radio 0.7-1.15 (mucho menor)
        const g = new THREE.SphereGeometry(r, 10, 8);
        const m = new THREE.MeshStandardMaterial({
          color: 0xffffff,
          transparent: true,
          opacity: 0.82,
          roughness: 1.0,
          metalness: 0.0,
          depthWrite: false      // si la cámara las atraviesa, no taponan tan duro
        });
        const esfera = new THREE.Mesh(g, m);
        esfera.position.set(
          (Math.random() - 0.5) * 2.5,
          (Math.random() - 0.5) * 0.5,
          (Math.random() - 0.5) * 1.8
        );
        esfera.castShadow = true;
        grupo.add(esfera);
      }
      grupo.position.set(p.x, p.y, p.z);
      grupo.userData.driftX = (Math.random() - 0.5) * 0.3;
      grupo.userData.driftZ = (Math.random() - 0.5) * 0.3;
      grupo.userData.posOrig = { x: p.x, z: p.z };
      grupo.userData.fase = idx * 1.3;
      nubes.push(grupo);
      scene.add(grupo);
    });
  }

  function animarNubes(t) {
    nubes.forEach(n => {
      // Deriva lenta en X y Z, con ondulación senoidal para naturalidad
      const orig = n.userData.posOrig;
      n.position.x = orig.x + Math.sin(t * 0.05 + n.userData.fase) * 4
                            + n.userData.driftX * t;
      n.position.z = orig.z + Math.cos(t * 0.04 + n.userData.fase) * 3
                            + n.userData.driftZ * t;
      // Reset cuando se alejan demasiado
      if (Math.abs(n.position.x - orig.x) > 30) {
        n.userData.driftX *= -1;
      }
      if (Math.abs(n.position.z - orig.z) > 30) {
        n.userData.driftZ *= -1;
      }
    });
  }

  // ---------- Bosque ----------
  function crearArbol(x, z, escala) {
    const grupo = new THREE.Group();

    const tronco = new THREE.Mesh(
      new THREE.CylinderGeometry(0.25, 0.4, 2.4, 8),
      new THREE.MeshStandardMaterial({ color: 0x5a3a22, roughness: 0.95 })
    );
    tronco.position.y = 1.2;
    tronco.castShadow = true;
    grupo.add(tronco);

    // Copa: sphere irregular con leve ruido
    const copaGeo = new THREE.SphereGeometry(1.5, 12, 10);
    const cpos = copaGeo.attributes.position;
    for (let i = 0; i < cpos.count; i++) {
      const x0 = cpos.getX(i), y0 = cpos.getY(i), z0 = cpos.getZ(i);
      const r = Math.sin(x0 * 3 + z0 * 2) * 0.15;
      cpos.setXYZ(i, x0 + r, y0 + r * 0.7, z0 + r);
    }
    copaGeo.computeVertexNormals();
    const copaMat = new THREE.MeshStandardMaterial({
      color: 0x3d8b3d,
      roughness: 0.85,
      flatShading: false
    });
    const copa = new THREE.Mesh(copaGeo, copaMat);
    copa.position.y = 3.2;
    copa.scale.set(1.1, 1.3, 1.1);
    copa.castShadow = true;
    grupo.add(copa);

    grupo.position.set(x, 0, z);
    grupo.scale.set(escala, escala, escala);
    grupo.userData.copa = copa;
    grupo.userData.escalaBase = escala;
    return grupo;
  }

  function crearBosque() {
    // 14 árboles distribuidos
    const posiciones = [
      [-30, -2], [-26, 5], [-22, -8], [-18, 2], [-15, -6], [-28, 9],
      [-32, 0], [-20, 8], [-24, -3], [-29, -10], [-17, -2], [-21, 12],
      [-33, -6], [-26, -12]
    ];
    posiciones.forEach(([x, z]) => {
      const escala = 0.8 + Math.random() * 0.4;
      const arbol = crearArbol(x, z, escala);
      arboles.push(arbol);
      scene.add(arbol);
    });
  }

      vaca.position.z + 1.65 * Math.sin(vaca.rotation.y) * -1

    coche.position.set(-2, 0, -8);
    coche.userData.tubo = new THREE.Vector3(coche.position.x - 1.1, 0.5, coche.position.z);
    scene.add(coche);
  }

  function animarCoche(t) {
    // El coche se desplaza por la carretera (idea + vuelta)
    const recorrido = 12;
    const x = -8 + ((t * 3) % recorrido);
    coche.position.x = x;
    coche.userData.tubo.x = x - 1.1;
    coche.userData.tubo.z = -8;
  }

  // ---------- Árbol caído (descomposición) ----------
  function crearArbolCaido() {
    arbolCaido = new THREE.Group();

    const tronco = new THREE.Mesh(
      new THREE.CylinderGeometry(0.4, 0.5, 3.2, 10),
      new THREE.MeshStandardMaterial({ color: 0x6a4a30, roughness: 0.95 })
    );
    tronco.rotation.z = Math.PI / 2;
    tronco.position.y = 0.4;
    tronco.castShadow = true;
    arbolCaido.add(tronco);

    // Pila de hojas marchitas alrededor
    for (let i = 0; i < 8; i++) {
      const ang = Math.random() * Math.PI * 2;
      const r = 1 + Math.random() * 1.5;
      const hoja = new THREE.Mesh(
        new THREE.SphereGeometry(0.25 + Math.random() * 0.15, 8, 6),
        new THREE.MeshStandardMaterial({ color: 0x8a6a3a, roughness: 0.95 })
      );
      hoja.position.set(Math.cos(ang) * r, 0.15, Math.sin(ang) * r);
      hoja.scale.y = 0.5;
      hoja.castShadow = true;
      arbolCaido.add(hoja);
    }

    // Hongos pequeños sobre el tronco
    for (let i = 0; i < 4; i++) {
      const hongo = new THREE.Group();
      const tallo = new THREE.Mesh(
        new THREE.CylinderGeometry(0.05, 0.05, 0.2, 6),
        new THREE.MeshStandardMaterial({ color: 0xeae0c4 })
      );
      tallo.position.y = 0.1;
      hongo.add(tallo);
      const sombrero = new THREE.Mesh(
        new THREE.SphereGeometry(0.15, 8, 6, 0, Math.PI * 2, 0, Math.PI / 2),
        new THREE.MeshStandardMaterial({ color: 0xc25a4a, roughness: 0.9 })
      );
      sombrero.position.y = 0.2;
      hongo.add(sombrero);
      hongo.position.set(-1.2 + i * 0.8, 0.85, (Math.random() - 0.5) * 0.4);
      arbolCaido.add(hongo);
    }

    arbolCaido.position.set(-13, 0, -10);
    scene.add(arbolCaido);
  }

  // ---------- Depósitos fósiles (subsuelo) ----------
  function crearDepositosFosiles() {
    // Capa visual de roca/sedimento en el subsuelo (ligeramente debajo del terreno)
    const capaGeo = new THREE.PlaneGeometry(80, 80);
    const capaMat = new THREE.MeshStandardMaterial({
      color: 0x4a3a2a,
      roughness: 0.95
    });
    const capa = new THREE.Mesh(capaGeo, capaMat);
    capa.rotation.x = -Math.PI / 2;
    capa.position.set(-5, -3.5, 0);
    scene.add(capa);

    // Bolsas de carbón/petróleo
    const posiciones = [
      [-15, -2.5,  4, 'carbon'],
      [ -8, -2.0, -5, 'carbon'],
      [  2, -2.8,  3, 'petroleo'],
      [  8, -3.2, -2, 'petroleo'],
      [-22, -2.4, -2, 'carbon'],
      [ -3, -2.2, -8, 'petroleo']
    ];
    posiciones.forEach(([x, y, z, tipo]) => {
      const r = 1.0 + Math.random() * 0.6;
      const geo = new THREE.SphereGeometry(r, 14, 10);
      // Deformar para que parezca bolsa irregular
      const pos = geo.attributes.position;
      for (let i = 0; i < pos.count; i++) {
        const x0 = pos.getX(i), y0 = pos.getY(i), z0 = pos.getZ(i);
        const f = 1 + Math.sin(x0 * 3 + z0 * 2) * 0.15;
        pos.setXYZ(i, x0 * f, y0 * 0.55, z0 * f);
      }
      geo.computeVertexNormals();

      const color = tipo === 'carbon' ? 0x101010 : 0x382418;
      const mat = new THREE.MeshStandardMaterial({
        color,
        roughness: tipo === 'carbon' ? 0.7 : 0.3,
        metalness: tipo === 'carbon' ? 0.2 : 0.5,
        emissive: tipo === 'carbon' ? 0x000000 : 0x100804,
        emissiveIntensity: 0.3
      });
      const mesh = new THREE.Mesh(geo, mat);
      mesh.position.set(x, y, z);
      mesh.userData = { tipo };
      depositosFosiles.push(mesh);
      scene.add(mesh);
    });
  }

  // Texturas reutilizables para distintos tipos de partícula
  function texturaPart(tipo) {
    if (TEX_CACHE[tipo]) return TEX_CACHE[tipo];
    const canvas = document.createElement('canvas');
    canvas.width = canvas.height = 32;
    const ctx = canvas.getContext('2d');
    const grad = ctx.createRadialGradient(16, 16, 0, 16, 16, 16);
    if (tipo === 'humo') {
      grad.addColorStop(0,   'rgba(80, 80, 80, 0.95)');
      grad.addColorStop(0.5, 'rgba(60, 60, 60, 0.55)');
      grad.addColorStop(1,   'rgba(40, 40, 40, 0)');
    } else if (tipo === 'oxigeno') {
      grad.addColorStop(0,   'rgba(220, 240, 255, 1)');
      grad.addColorStop(0.4, 'rgba(150, 210, 255, 0.7)');
      grad.addColorStop(1,   'rgba(120, 180, 230, 0)');
    } else if (tipo === 'burbuja') {
      grad.addColorStop(0,   'rgba(255, 255, 255, 0.95)');
      grad.addColorStop(0.5, 'rgba(200, 230, 255, 0.55)');
      grad.addColorStop(1,   'rgba(180, 220, 255, 0)');
    } else if (tipo === 'organico') {
      grad.addColorStop(0,   'rgba(140, 100, 60, 1)');
      grad.addColorStop(0.5, 'rgba(110, 80, 50, 0.6)');
      grad.addColorStop(1,   'rgba(80, 60, 40, 0)');
    } else if (tipo === 'comida') {
      grad.addColorStop(0,   'rgba(220, 255, 180, 1)');
      grad.addColorStop(0.5, 'rgba(150, 230, 100, 0.7)');
      grad.addColorStop(1,   'rgba(100, 200, 60, 0)');
    } else { // co2 default
      grad.addColorStop(0,   'rgba(170, 170, 170, 0.95)');
      grad.addColorStop(0.5, 'rgba(120, 120, 120, 0.55)');
      grad.addColorStop(1,   'rgba(80, 80, 80, 0)');
    }
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, 32, 32);
    const tex = new THREE.CanvasTexture(canvas);
    TEX_CACHE[tipo] = tex;
    return tex;
  }

  /**
   * Crea un flujo de partículas dirigido (origen → destino).
   * cfg: {
   *   numParticulas, tipo, size, etapasOpacidad: { idx: opMax },
   *   getSrc, getDst (funciones que devuelven Vector3),
   *   velocidad (rango ~0.05–1.0; menor = más lento),
   *   bamboleo, arc, blending ('add' o 'normal'),
   *   regenerarAlReiniciar (true/false)
   * }
   */
  function crearFlujo(cfg) {
    const num = cfg.numParticulas;
    const geo = new THREE.BufferGeometry();
    const positions = new Float32Array(num * 3);
    const ts = new Float32Array(num);
    const fases = new Float32Array(num);
    const sources = [];
    const targets = [];

    for (let i = 0; i < num; i++) {
      ts[i] = Math.random();
      fases[i] = Math.random() * Math.PI * 2;
      const s = cfg.getSrc();
      const d = cfg.getDst();
      sources.push(s);
      targets.push(d);
      const p = s.clone().lerp(d, ts[i]);
      positions[i * 3]     = p.x;
      positions[i * 3 + 1] = p.y;
      positions[i * 3 + 2] = p.z;
    }
    geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    geo.userData = { ts, fases, sources, targets };

    const mat = new THREE.PointsMaterial({
      size: cfg.size || 0.4,
      map: texturaPart(cfg.tipo),
      color: cfg.color || 0xffffff,
      transparent: true,
      opacity: 0,
      blending: cfg.blending === 'add' ? THREE.AdditiveBlending : THREE.NormalBlending,
      depthWrite: false,
      sizeAttenuation: true
    });

    const points = new THREE.Points(geo, mat);
    points.userData = { cfg };
    flujos.push(points);
    scene.add(points);
    return points;
  }

  function animarFlujo(flujo, idx, prog, deltaT) {
    const cfg = flujo.userData.cfg;
    const mat = flujo.material;

    // Calcular opacidad objetivo según etapa actual
    let opObjetivo = cfg.etapasOpacidad[idx] || 0;
    // Envoltura para suavizar entrada y salida dentro de la etapa
    if (opObjetivo > 0) {
      let env = 1;
      if (prog < 0.12)      env = prog / 0.12;
      else if (prog > 0.88) env = (1 - prog) / 0.12;
      opObjetivo *= env;
    }
    mat.opacity += (opObjetivo - mat.opacity) * 0.10;

    if (mat.opacity < 0.015) return;

    const pos = flujo.geometry.attributes.position;
    const ts = flujo.geometry.userData.ts;
    const fases = flujo.geometry.userData.fases;
    const sources = flujo.geometry.userData.sources;
    const targets = flujo.geometry.userData.targets;
    const dt = Math.min(deltaT, 0.05);
    const vel = cfg.velocidad || 0.4;

    for (let i = 0; i < ts.length; i++) {
      ts[i] += dt * vel * (1 + Math.sin(fases[i]) * 0.15);
      if (ts[i] > 1) {
        ts[i] = 0;
        if (cfg.regenerarAlReiniciar !== false) {
          sources[i] = cfg.getSrc();
          targets[i] = cfg.getDst();
        }
      }

      const t = ts[i];
      const sx = sources[i].x, sy = sources[i].y, sz = sources[i].z;
      const dx = targets[i].x, dy = targets[i].y, dz = targets[i].z;

      let x = sx + (dx - sx) * t;
      let y = sy + (dy - sy) * t;
      let z = sz + (dz - sz) * t;

      // Bamboleo lateral suave
      if (cfg.bamboleo) {
        x += Math.sin(t * 6 + fases[i]) * cfg.bamboleo;
        z += Math.cos(t * 5 + fases[i] * 1.3) * cfg.bamboleo;
      }
      // Arco vertical (parábola)
      if (cfg.arc) {
        y += Math.sin(t * Math.PI) * cfg.arc;
      }

      pos.array[i * 3]     = x;
      pos.array[i * 3 + 1] = y;
      pos.array[i * 3 + 2] = z;
    }
    pos.needsUpdate = true;
  }

  // ---------- Definición de los 10 flujos del ciclo ----------
  function crearFlujos() {
    // Helper: posición aleatoria en una zona del cielo
    const cieloSobre = (cx, cz, rango = 18, yMin = 16, yMax = 22) =>
      new THREE.Vector3(
        cx + (Math.random() - 0.5) * rango,
        yMin + Math.random() * (yMax - yMin),
        cz + (Math.random() - 0.5) * rango
      );

    // Helper: posición de una hoja aleatoria del bosque
    const hojaBosque = () => {
      const a = arboles[Math.floor(Math.random() * arboles.length)];
      return new THREE.Vector3(
        a.position.x + (Math.random() - 0.5) * 1.6,
        2.8 + Math.random() * 1.6,
        a.position.z + (Math.random() - 0.5) * 1.6
      );
    };

    // 0 — Fotosíntesis: CO₂ del aire entra a las hojas
    crearFlujo({
      numParticulas: 90, tipo: 'co2', color: 0xa8a8a8, size: 0.5,
      etapasOpacidad: { 0: 0.85 },
      velocidad: 0.55, bamboleo: 0.35,
      getSrc: () => cieloSobre(-25, 0, 18, 16, 22),
      getDst: () => hojaBosque()
    });

    // 1 — Fotosíntesis: O₂ sale de las hojas hacia el aire
    crearFlujo({
      numParticulas: 70, tipo: 'oxigeno', color: 0x9ad8ff, size: 0.5,
      etapasOpacidad: { 0: 0.8 },
      velocidad: 0.6, bamboleo: 0.25, blending: 'add',
      getSrc: () => hojaBosque(),
      getDst: () => cieloSobre(-30, 0, 22, 18, 24)
    });

    // 2 — Cadena alimenticia: hierba → vaca
    crearFlujo({
      numParticulas: 28, tipo: 'comida', color: 0xa8e060, size: 0.55,
      etapasOpacidad: { 1: 0.95 },
      velocidad: 0.7, arc: 0.6,
      getSrc: () => {
        const m = parchesHierba[Math.floor(Math.random() * parchesHierba.length)];
        return new THREE.Vector3(m.position.x, 0.6, m.position.z);
      },
      getDst: () => vaca.userData.boca.clone()
    });

    // 3 — Respiración: vaca + humano → CO₂ al aire
    crearFlujo({
      numParticulas: 60, tipo: 'co2', color: 0xa0a0a0, size: 0.42,
      etapasOpacidad: { 1: 0.85 },
      velocidad: 0.55, bamboleo: 0.3,
      getSrc: () => {
        return Math.random() < 0.55
          ? vaca.userData.boca.clone()
          : humano.userData.boca.clone();
      },
      getDst: () => cieloSobre(-5, 4, 20, 18, 22)
    });

    // 4 — Descomposición: árbol caído → CO₂ atmosférico
    crearFlujo({
      numParticulas: 60, tipo: 'co2', color: 0xb0a888, size: 0.45,
      etapasOpacidad: { 2: 0.9 },
      velocidad: 0.4, bamboleo: 0.4,
      getSrc: () => new THREE.Vector3(
        arbolCaido.position.x + (Math.random() - 0.5) * 3.2,
        0.4,
        arbolCaido.position.z + (Math.random() - 0.5) * 1.4
      ),
      getDst: () => cieloSobre(arbolCaido.position.x, arbolCaido.position.z, 14, 16, 22)
    });

    // 5 — Descomposición: árbol caído → suelo (carbono orgánico)
    crearFlujo({
      numParticulas: 35, tipo: 'organico', color: 0x8a5e36, size: 0.4,
      etapasOpacidad: { 2: 0.85, 5: 0.4 },
      velocidad: 0.25,
      getSrc: () => new THREE.Vector3(
        arbolCaido.position.x + (Math.random() - 0.5) * 3.0,
        0.4,
        arbolCaido.position.z + (Math.random() - 0.5) * 1.4
      ),
      getDst: () => new THREE.Vector3(
        arbolCaido.position.x + (Math.random() - 0.5) * 5,
        -2.5 - Math.random() * 0.5,
        arbolCaido.position.z + (Math.random() - 0.5) * 5
      )
    });

    // 6 — Combustión: chimenea de fábrica → atmósfera
    crearFlujo({
      numParticulas: 90, tipo: 'humo', color: 0x666666, size: 0.7,
      etapasOpacidad: { 3: 0.95 },
      velocidad: 0.6, bamboleo: 0.5,
      getSrc: () => fabrica.userData.salidaChimenea.clone().add(
        new THREE.Vector3((Math.random() - 0.5) * 0.4, 0, (Math.random() - 0.5) * 0.4)
      ),
      getDst: () => cieloSobre(fabrica.position.x + 3, fabrica.position.z, 16, 22, 28)
    });

    // 7 — Combustión: tubo de escape del coche → atmósfera (más bajo, más cercano)
    crearFlujo({
      numParticulas: 50, tipo: 'humo', color: 0x7a7a7a, size: 0.5,
      etapasOpacidad: { 3: 0.85 },
      velocidad: 0.7, bamboleo: 0.4,
      getSrc: () => coche.userData.tubo.clone(),
      getDst: () => cieloSobre(coche.position.x, coche.position.z, 12, 14, 18)
    });

    // 8 — Océano: atmósfera → océano (absorción de CO₂)
    crearFlujo({
      numParticulas: 70, tipo: 'co2', color: 0xa0a0a0, size: 0.45,
      etapasOpacidad: { 4: 0.85 },
      velocidad: 0.5, bamboleo: 0.3,
      getSrc: () => cieloSobre(28, 4, 30, 16, 20),
      getDst: () => new THREE.Vector3(20 + Math.random() * 28, 0.3, (Math.random() - 0.5) * 32)
    });

    // 9 — Océano: océano → atmósfera (burbujas que liberan CO₂)
    crearFlujo({
      numParticulas: 50, tipo: 'burbuja', color: 0xddeeff, size: 0.4,
      etapasOpacidad: { 4: 0.7 },
      velocidad: 0.45, bamboleo: 0.2, blending: 'add',
      getSrc: () => new THREE.Vector3(20 + Math.random() * 28, 0.3, (Math.random() - 0.5) * 32),
      getDst: () => cieloSobre(28, 4, 28, 12, 16)
    });

    // 10 — Geológico: suelo → depósitos fósiles (extremadamente lento)
    crearFlujo({
      numParticulas: 50, tipo: 'organico', color: 0x4a3520, size: 0.5,
      etapasOpacidad: { 5: 0.92 },
      velocidad: 0.12, bamboleo: 0.1,
      getSrc: () => new THREE.Vector3(
        (Math.random() - 0.5) * 36,
        0.2 + Math.random() * 0.3,
        (Math.random() - 0.5) * 26
      ),
      getDst: () => {
        const dep = depositosFosiles[Math.floor(Math.random() * depositosFosiles.length)];
        return dep.position.clone().add(new THREE.Vector3(
          (Math.random() - 0.5) * 0.6,
          (Math.random() - 0.5) * 0.3,
          (Math.random() - 0.5) * 0.6
        ));
      }
    });
  }

  // =========================================================
  // ETIQUETAS 3D
  // =========================================================
  function crearTexturaEtiqueta(texto, color) {
    // ----- Paso 1: medir el ancho del texto con un canvas temporal -----
    const tmpCtx = document.createElement('canvas').getContext('2d');
    tmpCtx.font = 'bold 52px "Segoe UI", Arial, sans-serif';
    const anchoTexto = tmpCtx.measureText(texto).width;

    // ----- Paso 2: dimensionar el canvas real con padding adecuado -----
    const padding = 90;                                      // 45 px a cada lado
    const ch = 128;
    const cw = Math.max(512, Math.ceil((anchoTexto + padding) / 4) * 4);

    const canvas = document.createElement('canvas');
    canvas.width = cw;
    canvas.height = ch;
    const ctx = canvas.getContext('2d');

    function rectRedondeado(x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.lineTo(x + w - r, y);
      ctx.quadraticCurveTo(x + w, y, x + w, y + r);
      ctx.lineTo(x + w, y + h - r);
      ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
      ctx.lineTo(x + r, y + h);
      ctx.quadraticCurveTo(x, y + h, x, y + h - r);
      ctx.lineTo(x, y + r);
      ctx.quadraticCurveTo(x, y, x + r, y);
      ctx.closePath();
    }

    ctx.fillStyle = 'rgba(8, 18, 35, 0.92)';
    rectRedondeado(8, 8, cw - 16, ch - 16, 22);
    ctx.fill();
    ctx.strokeStyle = color;
    ctx.lineWidth = 5;
    ctx.stroke();

    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 52px "Segoe UI", Arial, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(texto, cw / 2, ch / 2);

    const tex = new THREE.CanvasTexture(canvas);
    tex.userData = { aspect: cw / ch };                      // guardamos la proporción
    return tex;
  }

  function crearEtiquetas3D() {
    ETIQUETAS_POR_ETAPA.forEach((lista, idx) => {
      lista.forEach(info => {
        const tex = crearTexturaEtiqueta(info.texto, info.color);
        tex.minFilter = THREE.LinearFilter;
        const mat = new THREE.SpriteMaterial({
          map: tex,
          transparent: true,
          depthTest: false,
          depthWrite: false,
          opacity: 0
        });
        const sprite = new THREE.Sprite(mat);
        sprite.position.set(info.pos[0], info.pos[1], info.pos[2]);
        // Escala proporcional al ancho del canvas: alto fijo, ancho según el texto
        const altoSprite = 3.25;
        const aspect = tex.userData.aspect;                  // 4 para textos cortos, 6+ para largos
        sprite.scale.set(altoSprite * aspect, altoSprite, 1);
        sprite.userData = { idxEtapa: idx, yBase: info.pos[1] };
        sprite.renderOrder = 999;
        scene.add(sprite);
        etiquetas3D.push(sprite);
      });
    });
  }

  function animarEtiquetas(idx, prog) {
    etiquetas3D.forEach(eti => {
      const propia = eti.userData.idxEtapa === idx;
      let opObjetivo = 0;
      if (propia) {
        if (prog < 0.15)      opObjetivo = (prog / 0.15);
        else if (prog < 0.85) opObjetivo = 1;
        else                  opObjetivo = (1 - prog) / 0.15;
      }
      eti.material.opacity += (opObjetivo - eti.material.opacity) * 0.12;
      if (eti.material.opacity > 0.05) {
        eti.position.y = eti.userData.yBase + Math.sin(tiempoSimulado * 1.3 + eti.userData.idxEtapa) * 0.4;
      }
    });
  }

  // =========================================================
  // ANIMACIÓN PRINCIPAL
  // =========================================================
  function animate() {
    requestAnimationFrame(animate);
    const delta = clock.getDelta();
    if (!pausado) tiempoSimulado += delta;

    actualizarEtapa(delta);
    animarOleaje(tiempoSimulado);
    animarSol(tiempoSimulado);
    animarAtmosferaAmbiente(tiempoSimulado);
    animarNubes(tiempoSimulado);
    animarCoche(tiempoSimulado);
    animarCamara(tiempoSimulado);

    renderer.render(scene, camera);
  }

  function actualizarEtapa(deltaT) {
    const t = tiempoSimulado % CICLO_TOTAL;
    const idx = Math.floor(t / DURACION_ETAPA);
    const progreso = (t % DURACION_ETAPA) / DURACION_ETAPA;

    if (idx !== etapaActual) {
      etapaActual = idx;
      const e = ETAPAS[idx];
      const panel = document.getElementById('panel-etapa');
      panel.className = e.clase;
      document.getElementById('etapa-numero').textContent = e.num;
      document.getElementById('etapa-titulo').textContent = e.titulo;
      document.getElementById('etapa-desc').textContent = e.desc;
      document.querySelectorAll('.punto').forEach((p, i) => {
        p.classList.toggle('activo', i === idx);
      });
    }
    document.getElementById('barra-relleno').style.width = (progreso * 100) + '%';

    // Niebla y fondo (transición suave)
    const idxSig = (idx + 1) % TOTAL_ETAPAS;
    const colA = new THREE.Color(ETAPAS[idx].colorNiebla);
    const colB = new THREE.Color(ETAPAS[idxSig].colorNiebla);
    const colMix = colA.clone().lerp(colB, progreso);
    scene.background.copy(colMix);
    scene.fog.color.copy(colMix);

    // Animar todos los flujos
    flujos.forEach(f => animarFlujo(f, idx, progreso, deltaT));

    // Reacciones visuales por etapa
    animarReaccionesEscena(idx, progreso);

    // Etiquetas 3D
    animarEtiquetas(idx, progreso);

    // Modo educativo: pausa al final de cada etapa
    if (modoEducativo && !pausaEducativaActiva && progreso > 0.92 && idx !== ultimaEtapaPausada) {
      ultimaEtapaPausada = idx;
      abrirPanelEducativo(idx);
    }
    if (idx === 0 && progreso < 0.05 && ultimaEtapaPausada === TOTAL_ETAPAS - 1) {
      ultimaEtapaPausada = -1;
    }
  }

  // ---------- Reacciones visuales de objetos por etapa ----------
  function animarReaccionesEscena(idx, prog) {
    // Fotosíntesis: árboles "respiran" — ligero pulso de escala y brillo
    const factorBosque = (idx === 0) ? (1 + Math.sin(prog * Math.PI * 4) * 0.04) : 1;
    arboles.forEach(a => {
      const objetivo = a.userData.escalaBase * factorBosque;
      const actual = a.scale.x;
      const nuevo = actual + (objetivo - actual) * 0.15;
      a.scale.set(nuevo, nuevo, nuevo);
      // Brillo emisivo durante fotosíntesis
      const emObjetivo = (idx === 0) ? 0.15 : 0.0;
      const cur = a.userData.copa.material.emissiveIntensity || 0;
      a.userData.copa.material.emissive = new THREE.Color(0x4caf50);
      a.userData.copa.material.emissiveIntensity = cur + (emObjetivo - cur) * 0.08;
    });

    // Combustión: ventanas y banda de chimenea pulsan en rojo/naranja
    if (idx === 3) {
      const pulso = 0.8 + Math.sin(tiempoSimulado * 6) * 0.2;
      // Ventanas
      fabrica.children.forEach(c => {
        if (c.material && c.material.emissive && c.geometry.type === 'BoxGeometry') {
          if (c.material.color.r > 0.9 && c.material.color.g > 0.7) {
            c.material.emissiveIntensity = 0.6 * pulso;
          }
        }
      });
    }

    // Geológico: el terreno se vuelve semitransparente para mostrar los depósitos enterrados
    let opTerrObjetivo = 1.0;
    if (idx === 5) {
      // Disminuye hacia el principio, aumenta hacia el final
      if (prog < 0.2)      opTerrObjetivo = 1.0 - prog * 2.5;          // 1.0 → 0.5
      else if (prog < 0.8) opTerrObjetivo = 0.5;
      else                 opTerrObjetivo = 0.5 + (prog - 0.8) * 2.5;  // 0.5 → 1.0
    }
    terrain.material.opacity += (opTerrObjetivo - terrain.material.opacity) * 0.06;

    // Geológico: depósitos fósiles brillan suavemente
    depositosFosiles.forEach(d => {
      const pulsoIntensidad = (idx === 5) ? (0.3 + Math.sin(tiempoSimulado * 1.5) * 0.15) : 0.1;
      d.material.emissiveIntensity += (pulsoIntensidad - d.material.emissiveIntensity) * 0.05;
      // Color emisivo suave dorado para hacerlos visibles
      d.material.emissive = new THREE.Color(d.userData.tipo === 'carbon' ? 0x401818 : 0x402810);
    });
  }

  // ---------- Sol y cámara ----------
  function animarSol(t) {
    const pulso = 1 + Math.sin(t * 1.4) * 0.04;
    sun.scale.set(pulso, pulso, pulso);
    if (sunGlow) sunGlow.material.opacity = 0.7 + Math.sin(t * 1.2) * 0.15;
  }

  function animarCamara(t) {
    // Foco objetivo según etapa (lerp suave)
    const idx = Math.floor((t % CICLO_TOTAL) / DURACION_ETAPA);
    const idxSig = (idx + 1) % TOTAL_ETAPAS;
    const prog = (t % DURACION_ETAPA) / DURACION_ETAPA;

    const f1 = ETAPAS[idx].foco;
    const f2 = ETAPAS[idxSig].foco;
    // Mezcla suave en transiciones (último 15% de la etapa hacia la siguiente)
    const mezcla = prog > 0.85 ? (prog - 0.85) / 0.15 : 0;
    const fx = f1.x * (1 - mezcla) + f2.x * mezcla;
    const fy = f1.y * (1 - mezcla) + f2.y * mezcla;
    const fz = f1.z * (1 - mezcla) + f2.z * mezcla;
    const radio = f1.radio * (1 - mezcla) + f2.radio * mezcla;

    // Órbita lenta alrededor del foco
    const ang = t * 0.08;
    // Cámara orbita con altura 17-22 (techo a 22), por debajo de las nubes (~y=25)
    const altura = 19.5 + Math.sin(t * 0.13) * 2.5;

    camera.position.x = fx + Math.cos(ang) * radio;
    camera.position.z = fz + Math.sin(ang) * radio;
    camera.position.y = (idx === 5)
      ? altura - 8     // Más bajo en etapa geológica para ver el subsuelo
      : altura;

    camera.lookAt(fx, fy, fz);
  }

  function onResize() {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  }
  </script>
